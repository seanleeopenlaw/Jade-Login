<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - JADE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --background: #f7f9fc;
      --foreground: #374151;
      --card: #ffffff;
      --card-foreground: #374151;
      --primary: #089444;
      --primary-foreground: #ffffff;
      --secondary: #e0f2fe;
      --secondary-foreground: #4b5563;
      --muted: #f3f4f6;
      --muted-foreground: #6b7280;
      --accent: #e0f2fe;
      --accent-foreground: #374151;
      --border: #e5e7eb;
      --input: #e5e7eb;
      --ring: #089444;
      --font-sans: 'DM Sans', sans-serif;
      --font-serif: 'Lora', serif;
      --radius: 0.5rem;
      --shadow-sm: 0px 4px 8px -1px hsl(0 0% 0% / 0.10), 0px 1px 2px -2px hsl(0 0% 0% / 0.10);
      --shadow-md: 0px 8px 16px -2px hsl(0 0% 0% / 0.12), 0px 2px 4px -3px hsl(0 0% 0% / 0.12);
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--background);
      color: var(--foreground);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .card {
      background-color: var(--card);
      color: var(--card-foreground);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
    }

    .text-primary { color: var(--primary); }
    .bg-primary { background-color: var(--primary); color: var(--primary-foreground); }
    .text-muted { color: var(--muted-foreground); }
    .border-color { border-color: var(--border); }

    .btn-primary {
      padding: 0.875rem 1.5rem;
      background-color: var(--primary);
      color: var(--primary-foreground);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s;
      width: 100%;
      font-family: var(--font-sans);
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(8, 148, 68, 0.3);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .input-field {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background-color: var(--card);
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: 1rem;
      width: 100%;
      transition: all 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(8, 148, 68, 0.1);
    }

    .link-primary {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .link-primary:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    .password-strength {
      height: 4px;
      background-color: var(--muted);
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
    }

    .password-strength-bar {
      height: 100%;
      transition: width 0.3s, background-color 0.3s;
      width: 0;
      background-color: #ef4444;
    }

    .password-strength-bar.weak {
      width: 33%;
      background-color: #ef4444;
    }

    .password-strength-bar.medium {
      width: 66%;
      background-color: #f59e0b;
    }

    .password-strength-bar.strong {
      width: 100%;
      background-color: #22c55e;
    }

    .requirement {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--muted-foreground);
    }

    .requirement.met {
      color: #22c55e;
    }

    .requirement-icon {
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .requirement.met .requirement-icon {
      background-color: #22c55e;
      border-color: #22c55e;
      color: white;
    }

    .fade-in {
      animation: fadeIn 0.4s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="border-b border-color bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center">
        <img src="jade_logo.svg" alt="JADE" class="h-8" />
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
    <div class="max-w-md w-full fade-in">
      <!-- Headline -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-accent rounded-full mb-4">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-primary">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 11V7C7 5.67392 7.52678 4.40215 8.46447 3.46447C9.40215 2.52678 10.6739 2 12 2C13.3261 2 14.5979 2.52678 15.5355 3.46447C16.4732 4.40215 17 5.67392 17 7V11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 class="text-3xl sm:text-4xl font-bold mb-3" style="font-family: var(--font-serif); line-height: 1.2;">
          Set new password
        </h2>
        <p class="text-lg text-muted">
          Choose a strong password for your account
        </p>
      </div>

      <!-- Reset Form Card -->
      <div class="card p-6 sm:p-8">
        <form id="reset-form" class="space-y-5">
          <!-- Password Input -->
          <div>
            <label for="password" class="block text-sm font-medium mb-2">New Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="input-field"
              placeholder="••••••••"
              required
              autocomplete="new-password"
            />
            <div class="password-strength">
              <div id="strength-bar" class="password-strength-bar"></div>
            </div>
          </div>

          <!-- Confirm Password Input -->
          <div>
            <label for="confirm-password" class="block text-sm font-medium mb-2">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              class="input-field"
              placeholder="••••••••"
              required
              autocomplete="new-password"
            />
          </div>

          <!-- Password Requirements -->
          <div class="bg-muted p-4 rounded-lg space-y-2">
            <p class="text-xs font-semibold text-foreground mb-3">Password must contain:</p>
            <div id="req-length" class="requirement">
              <span class="requirement-icon"></span>
              <span>At least 8 characters</span>
            </div>
            <div id="req-uppercase" class="requirement">
              <span class="requirement-icon"></span>
              <span>One uppercase letter</span>
            </div>
            <div id="req-lowercase" class="requirement">
              <span class="requirement-icon"></span>
              <span>One lowercase letter</span>
            </div>
            <div id="req-number" class="requirement">
              <span class="requirement-icon"></span>
              <span>One number</span>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="submit-btn" class="btn-primary" disabled>
            Reset Password & Continue
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-color bg-white py-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-center gap-4 text-sm text-muted">
        <a href="#" class="link-primary">Terms</a>
        <span>·</span>
        <a href="#" class="link-primary">Privacy</a>
        <span>·</span>
        <a href="#" class="link-primary">Contact</a>
      </div>
      <p class="text-center text-xs text-muted mt-3">
        © 2025 JADE. All rights reserved.
      </p>
    </div>
  </footer>

  <script>
    'use strict';

    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const strengthBar = document.getElementById('strength-bar');
    const submitBtn = document.getElementById('submit-btn');

    // Password requirements
    const requirements = {
      length: { element: document.getElementById('req-length'), test: (pwd) => pwd.length >= 8 },
      uppercase: { element: document.getElementById('req-uppercase'), test: (pwd) => /[A-Z]/.test(pwd) },
      lowercase: { element: document.getElementById('req-lowercase'), test: (pwd) => /[a-z]/.test(pwd) },
      number: { element: document.getElementById('req-number'), test: (pwd) => /[0-9]/.test(pwd) }
    };

    // Check password strength
    function checkPasswordStrength(password) {
      let metCount = 0;

      for (const [key, req] of Object.entries(requirements)) {
        const isMet = req.test(password);
        req.element.classList.toggle('met', isMet);
        if (isMet) metCount++;
      }

      // Update strength bar
      strengthBar.className = 'password-strength-bar';
      if (metCount === 0) {
        strengthBar.style.width = '0';
      } else if (metCount <= 2) {
        strengthBar.classList.add('weak');
      } else if (metCount === 3) {
        strengthBar.classList.add('medium');
      } else {
        strengthBar.classList.add('strong');
      }

      return metCount === 4;
    }

    // Check if passwords match and all requirements are met
    function validateForm() {
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      const allRequirementsMet = checkPasswordStrength(password);
      const passwordsMatch = password === confirmPassword && confirmPassword.length > 0;

      submitBtn.disabled = !(allRequirementsMet && passwordsMatch);
    }

    // Event listeners
    passwordInput.addEventListener('input', validateForm);
    confirmPasswordInput.addEventListener('input', validateForm);

    // Form submission handler
    document.getElementById('reset-form').addEventListener('submit', (e) => {
      e.preventDefault();

      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (password !== confirmPassword) {
        alert('Passwords do not match!');
        return;
      }

      console.log('Password reset successful');

      // Show loading state
      submitBtn.textContent = 'Resetting password...';
      submitBtn.disabled = true;

      // Simulate API call - Reset password and auto-login
      setTimeout(() => {
        submitBtn.textContent = 'Success! Logging you in...';

        // Auto-login after password reset
        setTimeout(() => {
          // In production, this would:
          // 1. Reset the password via API
          // 2. Create a new session token
          // 3. Auto-login the user
          // 4. Redirect to offer page
          window.location.href = '2-offer-page.html';
        }, 800);
      }, 1500);
    });
  </script>
</body>
</html>
