<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - JADE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">

  <style>
    .password-strength {
      height: 4px;
      background-color: var(--muted);
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
    }

    .password-strength-bar {
      height: 100%;
      transition: width 0.3s, background-color 0.3s;
      width: 0;
      background-color: #ef4444;
    }

    .password-strength-bar.weak {
      width: 33%;
      background-color: #ef4444;
    }

    .password-strength-bar.medium {
      width: 66%;
      background-color: #f59e0b;
    }

    .password-strength-bar.strong {
      width: 100%;
      background-color: #22c55e;
    }

    .requirement {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--muted-foreground);
    }

    .requirement.met {
      color: #22c55e;
    }

    .requirement-icon {
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .requirement.met .requirement-icon {
      background-color: #22c55e;
      border-color: #22c55e;
      color: white;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="border-b border-color bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center">
        <img src="jade_logo.svg" alt="JADE Legal Research" class="h-8" />
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
    <div class="max-w-md w-full fade-in">
      <!-- Headline -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-accent rounded-full mb-4">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-primary" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 11V7C7 5.67392 7.52678 4.40215 8.46447 3.46447C9.40215 2.52678 10.6739 2 12 2C13.3261 2 14.5979 2.52678 15.5355 3.46447C16.4732 4.40215 17 5.67392 17 7V11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="text-3xl sm:text-4xl font-bold mb-3" style="font-family: var(--font-serif); line-height: 1.2;">
          Set new password
        </h1>
        <p class="text-lg text-muted">
          Choose a strong password for your account
        </p>
      </div>

      <!-- Reset Form Card -->
      <div class="card p-6 sm:p-8">
        <!-- Error Message -->
        <div id="error-message" class="error-message" role="alert" aria-live="assertive">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M12 8v4m0 4h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="error-text"></span>
        </div>

        <!-- Status announcer for screen readers -->
        <div aria-live="polite" aria-atomic="true" class="sr-only" id="status-message"></div>

        <form id="reset-form" class="space-y-5" novalidate>
          <!-- Password Input -->
          <div>
            <label for="password" class="block text-sm font-medium mb-2">New Password</label>
            <div class="password-container">
              <input
                type="password"
                id="password"
                name="password"
                class="input-field"
                placeholder="••••••••"
                required
                autocomplete="new-password"
                aria-required="true"
                aria-describedby="password-error"
              />
              <button
                type="button"
                class="password-toggle"
                id="password-toggle"
                aria-label="Show password"
                tabindex="0"
              >
                <svg id="password-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="password-strength">
              <div id="strength-bar" class="password-strength-bar"></div>
            </div>
            <span id="password-error" class="error-text" style="display: none; color: var(--error); font-size: 0.875rem; margin-top: 0.25rem;"></span>
          </div>

          <!-- Confirm Password Input -->
          <div>
            <label for="confirm-password" class="block text-sm font-medium mb-2">Confirm Password</label>
            <div class="password-container">
              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                class="input-field"
                placeholder="••••••••"
                required
                autocomplete="new-password"
                aria-required="true"
                aria-describedby="confirm-password-error"
              />
              <button
                type="button"
                class="password-toggle"
                id="confirm-password-toggle"
                aria-label="Show password"
                tabindex="0"
              >
                <svg id="confirm-password-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <span id="confirm-password-error" class="error-text" style="display: none; color: var(--error); font-size: 0.875rem; margin-top: 0.25rem;"></span>
          </div>

          <!-- Password Requirements -->
          <div class="bg-muted p-4 rounded-lg space-y-2">
            <p class="text-xs font-semibold text-foreground mb-3">Password must contain:</p>
            <div id="req-length" class="requirement">
              <span class="requirement-icon"></span>
              <span>At least 8 characters</span>
            </div>
            <div id="req-uppercase" class="requirement">
              <span class="requirement-icon"></span>
              <span>One uppercase letter</span>
            </div>
            <div id="req-lowercase" class="requirement">
              <span class="requirement-icon"></span>
              <span>One lowercase letter</span>
            </div>
            <div id="req-number" class="requirement">
              <span class="requirement-icon"></span>
              <span>One number</span>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="submit-btn" class="btn-primary" disabled>
            Reset Password & Continue
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-color bg-white py-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-center gap-4 text-sm text-muted">
        <a href="#" class="link-primary">Terms</a>
        <span>·</span>
        <a href="#" class="link-primary">Privacy</a>
        <span>·</span>
        <a href="#" class="link-primary">Contact</a>
      </div>
      <p class="text-center text-xs text-muted mt-3">
        © 2025 JADE. All rights reserved.
      </p>
    </div>
  </footer>

  <script src="js/utils.js"></script>
  <script>
    'use strict';

    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const strengthBar = document.getElementById('strength-bar');
    const submitBtn = document.getElementById('submit-btn');
    const resetForm = document.getElementById('reset-form');
    const passwordToggle = document.getElementById('password-toggle');
    const confirmPasswordToggle = document.getElementById('confirm-password-toggle');

    // Password visibility toggles
    passwordToggle.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      passwordToggle.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');

      const icon = document.getElementById('password-icon');
      if (isPassword) {
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    });

    confirmPasswordToggle.addEventListener('click', () => {
      const isPassword = confirmPasswordInput.type === 'password';
      confirmPasswordInput.type = isPassword ? 'text' : 'password';
      confirmPasswordToggle.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');

      const icon = document.getElementById('confirm-password-icon');
      if (isPassword) {
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    });

    // Password requirements
    const requirements = {
      length: { element: document.getElementById('req-length'), test: (pwd) => pwd.length >= 8 },
      uppercase: { element: document.getElementById('req-uppercase'), test: (pwd) => /[A-Z]/.test(pwd) },
      lowercase: { element: document.getElementById('req-lowercase'), test: (pwd) => /[a-z]/.test(pwd) },
      number: { element: document.getElementById('req-number'), test: (pwd) => /[0-9]/.test(pwd) }
    };

    // Check password strength
    function checkPasswordStrength(password) {
      let metCount = 0;

      for (const [key, req] of Object.entries(requirements)) {
        const isMet = req.test(password);
        req.element.classList.toggle('met', isMet);
        if (isMet) metCount++;
      }

      // Update strength bar
      strengthBar.className = 'password-strength-bar';
      if (metCount === 0) {
        strengthBar.style.width = '0';
      } else if (metCount <= 2) {
        strengthBar.classList.add('weak');
      } else if (metCount === 3) {
        strengthBar.classList.add('medium');
      } else {
        strengthBar.classList.add('strong');
      }

      return metCount === 4;
    }

    // Check if passwords match and all requirements are met
    function validateForm() {
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      const allRequirementsMet = checkPasswordStrength(password);
      const passwordsMatch = password === confirmPassword && confirmPassword.length > 0;

      // Show/hide confirm password error
      const confirmErrorEl = document.getElementById('confirm-password-error');
      if (confirmPassword && !passwordsMatch) {
        confirmPasswordInput.classList.add('error');
        confirmErrorEl.textContent = 'Passwords do not match';
        confirmErrorEl.style.display = 'block';
      } else {
        confirmPasswordInput.classList.remove('error');
        confirmErrorEl.style.display = 'none';
      }

      submitBtn.disabled = !(allRequirementsMet && passwordsMatch);
    }

    // Event listeners
    passwordInput.addEventListener('input', () => {
      validateForm();
      hideError();
    });

    confirmPasswordInput.addEventListener('input', () => {
      validateForm();
      hideError();
    });

    // Form submission handler
    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
      }

      const validation = validatePassword(password);
      if (!validation.isValid) {
        showError('Password does not meet all requirements');
        return;
      }

      // Show loading state
      showLoading(submitBtn, 'Resetting password...');
      document.getElementById('status-message').textContent = 'Resetting your password, please wait';

      // Simulate API call - Reset password and auto-login
      try {
        await new Promise((resolve) => setTimeout(resolve, 1500));

        submitBtn.textContent = 'Success! Logging you in...';
        document.getElementById('status-message').textContent = 'Password reset successful. Logging you in.';

        // Auto-login after password reset
        setTimeout(() => {
          // In production, this would:
          // 1. Reset the password via API
          // 2. Create a new session token
          // 3. Auto-login the user
          // 4. Store session data
          setSession('userEmail', 'user@example.com');
          setSession('isAuthenticated', true);
          setSession('loginTime', new Date().toISOString());

          // Redirect to plan selection page
          window.location.href = '3-plan-selection.html';
        }, 800);
      } catch (error) {
        hideLoading(submitBtn);
        showError('Failed to reset password. Please try again.');
        document.getElementById('status-message').textContent = 'Password reset failed';
      }
    });
  </script>
</body>
</html>
