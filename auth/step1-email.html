<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - JADE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
  <!-- Header -->
  <header class="border-b border-color bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center">
        <img src="../jade_logo.svg" alt="JADE Legal Research" class="h-8" />
      </div>
      <div class="flex items-center gap-4">
        <a href="#" class="link-primary text-sm">Help</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
    <div class="max-w-md w-full fade-in">
      <!-- Headline -->
      <div class="text-center mb-8">
        <h1 class="text-3xl sm:text-4xl font-bold mb-3" style="font-family: var(--font-serif); line-height: 1.2;">
          Sign in to JADE
        </h1>
        <p class="text-base text-muted">
          Enter your work email to continue
        </p>
      </div>

      <!-- Email Form Card -->
      <div class="card p-6 sm:p-8">
        <!-- Error Message -->
        <div id="error-message" class="error-message" role="alert" aria-live="assertive">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M12 8v4m0 4h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="error-text"></span>
        </div>

        <!-- Status announcer for screen readers -->
        <div aria-live="polite" aria-atomic="true" class="sr-only" id="status-message"></div>

        <form id="email-form" class="space-y-5" novalidate>
          <!-- Email Input -->
          <div>
            <label for="email" class="block text-sm font-medium mb-2">Work email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="input-field"
              placeholder="you@company.com"
              required
              autocomplete="email"
              autofocus
              aria-required="true"
              aria-describedby="email-error email-hint"
            />
            <span id="email-error" class="error-text" style="display: none; color: var(--error); font-size: 0.875rem; margin-top: 0.25rem;"></span>
            <p id="email-hint" class="text-xs text-muted mt-1">
              We'll check if your organization uses single sign-on
            </p>
          </div>

          <!-- Continue Button -->
          <button type="submit" class="btn-primary" id="continue-btn">
            Continue
          </button>
        </form>

        <!-- Divider -->
        <div class="divider">or</div>

        <!-- Legacy Password Login Link -->
        <div class="text-center">
          <a href="../1-gated-landing.html" class="link-primary text-sm">
            Sign in with password instead
          </a>
        </div>
      </div>

      <!-- Info Box -->
      <div class="mt-6 p-4 bg-accent rounded-lg border border-primary text-center">
        <p class="text-xs text-muted">
          <strong class="text-foreground">New to JADE?</strong><br>
          Don't worry! We'll create your account automatically when you sign in.
        </p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-color bg-white py-6 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-center gap-4 text-sm text-muted">
        <a href="#" class="link-primary">Terms</a>
        <span>·</span>
        <a href="#" class="link-primary">Privacy</a>
        <span>·</span>
        <a href="#" class="link-primary">Contact</a>
      </div>
      <p class="text-center text-xs text-muted mt-3">
        © 2025 JADE. All rights reserved.
      </p>
    </div>
  </footer>

  <script src="../js/utils.js"></script>
  <script src="../js/sso-config.js"></script>
  <script>
    'use strict';

    const emailInput = document.getElementById('email');
    const emailForm = document.getElementById('email-form');
    const continueBtn = document.getElementById('continue-btn');

    // Input validation
    function validateEmail() {
      const email = emailInput.value.trim();
      const errorEl = document.getElementById('email-error');

      if (!email) {
        emailInput.classList.add('error');
        errorEl.textContent = 'Please enter your email address';
        errorEl.style.display = 'block';
        return false;
      }

      if (!isValidEmail(email)) {
        emailInput.classList.add('error');
        errorEl.textContent = 'Please enter a valid email address';
        errorEl.style.display = 'block';
        return false;
      }

      if (!isValidDomain(email)) {
        emailInput.classList.add('error');
        errorEl.textContent = 'Please use a valid email domain';
        errorEl.style.display = 'block';
        return false;
      }

      emailInput.classList.remove('error');
      errorEl.style.display = 'none';
      return true;
    }

    // Real-time validation
    emailInput.addEventListener('blur', validateEmail);

    // Clear error on input
    emailInput.addEventListener('input', () => {
      if (emailInput.classList.contains('error')) {
        emailInput.classList.remove('error');
        document.getElementById('email-error').style.display = 'none';
      }
      hideError();
    });

    // Form submission
    emailForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      // Validate email
      if (!validateEmail()) {
        showError('Please enter a valid email address');
        return;
      }

      const email = emailInput.value.trim().toLowerCase();

      // Show loading state
      showLoading(continueBtn, 'Checking...');
      document.getElementById('status-message').textContent = 'Checking authentication options';

      // Simulate API check delay
      await new Promise(resolve => setTimeout(resolve, 800));

      // Detect SSO availability
      const authMethods = getAuthMethods(email);

      // Store email and auth methods in session
      setSession('authEmail', email);
      setSession('authMethods', authMethods);

      // Redirect to auth method selection
      window.location.href = 'step2-method.html';
    });

    // Pre-fill email if coming back from step 2
    const savedEmail = getSession('authEmail');
    if (savedEmail) {
      emailInput.value = savedEmail;
    }
  </script>
</body>
</html>
