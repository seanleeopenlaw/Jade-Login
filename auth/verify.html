<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying Sign-In - JADE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/jade.css">
</head>
<body class="jade-theme">
  <main id="main-content" class="flex-1 flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
    <article class="max-w-md w-full text-center">
      <!-- Logo -->
      <img src="../jade_logo.svg" alt="JADE Legal Research" class="h-10 mx-auto mb-8" />

      <!-- Loading State -->
      <section id="loading-state" class="fade-in">
        <div class="spinner mb-6"></div>
        <h1 class="text-2xl font-bold mb-3 font-serif" id="loading-title">
          Verifying your sign-in link...
        </h1>
        <p class="jade-text-muted" id="loading-subtitle">Please wait a moment</p>
      </section>

      <!-- Success State -->
      <section id="success-state" class="fade-in hidden">
        <div class="success-icon status-icon mb-6">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M8 12l3 3 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold mb-3 font-serif jade-text-primary" id="success-title">
          Sign-in successful!
        </h1>
        <p class="jade-text-muted mb-4" id="success-subtitle">Redirecting you to JADE...</p>
      </section>

      <!-- Error State -->
      <section id="error-state" class="fade-in hidden">
        <div class="error-icon status-icon mb-6">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M12 8v4m0 4h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold mb-3 font-serif">
          Unable to verify sign-in link
        </h1>
        <p class="jade-text-muted mb-6" id="error-message">
          This link may have expired or is invalid
        </p>
        <a href="/" class="btn-primary inline-block">
          Request a new sign-in link
        </a>
      </section>

    </article>
  </main>

  <script src="../js/components.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/loading-states.js"></script>
  <script src="../js/magic-link.js"></script>

  <script>
    'use strict';

    // Parse URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const email = urlParams.get('email');
    const method = urlParams.get('method'); // 'code' or null (magic link)

    const errorMessage = document.getElementById('error-message');
    const loadingTitle = document.getElementById('loading-title');
    const loadingSubtitle = document.getElementById('loading-subtitle');
    const successTitle = document.getElementById('success-title');
    const successSubtitle = document.getElementById('success-subtitle');

    // Update messages based on verification method
    if (method === 'code') {
      loadingTitle.textContent = 'Verifying your code...';
      loadingSubtitle.textContent = 'Please wait a moment';
      successTitle.textContent = 'Code verified!';
      successSubtitle.textContent = 'Redirecting you to JADE...';
    }

    async function showError(message) {
      document.getElementById('loading-state').classList.add('hidden');
      errorMessage.textContent = message;
      document.getElementById('error-state').classList.remove('hidden');

      // Animate error icon
      await delay(100);
      const errorIcon = document.querySelector('.error-icon');
      if (errorIcon) errorIcon.classList.add('show');
    }

    // Verify code or token
    async function verifyAndLogin() {
      // Simulate network delay
      await delay(1500);

      let result;
      let authEmail;

      if (method === 'code') {
        // Verification code flow
        const verifiedCode = getSession('verifiedCode');
        authEmail = getSession('authEmail');

        if (!verifiedCode || !authEmail) {
          showError('Invalid verification code. Please try again.');
          return;
        }

        // In production: verify code against backend
        // For demo: accept any 6-digit code
        result = {
          valid: true,
          email: authEmail
        };
      } else {
        // Magic link flow
        if (!token || !email) {
          showError('Invalid sign-in link. Please request a new one.');
          return;
        }

        // Verify token
        result = verifyMagicLinkToken(decodeURIComponent(email), token);

        if (!result.valid) {
          showError(result.error);
          return;
        }

        authEmail = result.email;
      }

      // Success! Create session
      setSession('userEmail', authEmail);
      setSession('isAuthenticated', true);
      setSession('authMethod', method === 'code' ? 'verification-code' : 'magic-link');
      setSession('loginTime', new Date().toISOString());

      // Check if new user (simple check: no previous login)
      const previousLogin = localStorage.getItem('hasLoggedInBefore');
      if (!previousLogin) {
        setSession('isNewUser', true);
        localStorage.setItem('hasLoggedInBefore', 'true');
      }

      // Show success state with animation
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('success-state').classList.remove('hidden');

      // Animate success icon
      await delay(100);
      const successIcon = document.querySelector('.success-icon');
      if (successIcon) successIcon.classList.add('show');

      // Redirect after short delay
      await delay(1500);
      const redirectUrl = getPostAuthRedirect(authEmail);
      window.location.href = '../' + redirectUrl;
    }

    // Start verification
    verifyAndLogin();

    // Initialize auth footer
    initAuthFooter();
  </script>
</body>
</html>
