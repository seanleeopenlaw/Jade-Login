<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Sign-In Method - JADE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/jade.css">
</head>
<body class="jade-theme">
  <main id="main-content" class="flex-1 flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
    <div class="max-w-md w-full fade-in">
      <div class="text-center mb-8">
        <!-- Logo -->
        <img src="../jade_logo.svg" alt="JADE Legal Research" class="h-10 mx-auto mb-8" />
        <h1 class="text-3xl sm:text-4xl font-bold mb-3" style="font-family: var(--font-serif); line-height: 1.2;">
          Sign in to JADE
        </h1>
        <p class="text-base jade-text-muted mb-2" id="sso-message">This email is managed by your organization.</p>
        <p class="text-base font-semibold text-foreground mb-2" id="user-email-display"></p>
        <a href="../1-gated-landing.html" class="text-sm link-primary">Change email</a>
      </div>

      <div class="card p-6 sm:p-8">
        <div id="error-message" class="error-message" role="alert" aria-live="assertive">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M12 8v4m0 4h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="error-text"></span>
        </div>

        <!-- SSO Options (shown if available) -->
        <div id="sso-options" style="display: none;">
          <button type="button" class="btn-secondary mb-3" id="google-sso-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with Google
          </button>

          <button type="button" class="btn-secondary mb-3" id="microsoft-sso-btn" style="display: none;">
            <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path fill="#f25022" d="M0 0h11v11H0z"/>
              <path fill="#00a4ef" d="M12 0h11v11H12z"/>
              <path fill="#7fba00" d="M0 12h11v11H0z"/>
              <path fill="#ffb900" d="M12 12h11v11H12z"/>
            </svg>
            Sign in with Microsoft
          </button>

          <div class="divider">or</div>
        </div>

        <!-- Magic Link Option -->
        <div id="magic-link-section">
          <button type="button" class="btn-secondary" id="magic-link-btn">
            Use email instead →
          </button>
          <p class="text-xs jade-text-muted mt-3 text-center">
            We'll send you a secure sign-in link
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/sso-config.js"></script>
  <script src="../js/magic-link.js"></script>
  
  <script>
    'use strict';

    // Get auth methods from session
    const authMethods = getSession('authMethods');
    const email = getSession('authEmail');

    if (!email || !authMethods) {
      window.location.href = '../1-gated-landing.html';
    }

    // Display user email
    document.getElementById('user-email-display').textContent = email;

    // Show SSO options if available
    if (authMethods.hasSSO) {
      const ssoOptions = document.getElementById('sso-options');
      ssoOptions.style.display = 'block';

      // Show appropriate SSO buttons
      if (authMethods.providers.includes('google')) {
        document.getElementById('google-sso-btn').style.display = 'flex';
      }
      if (authMethods.providers.includes('microsoft')) {
        document.getElementById('microsoft-sso-btn').style.display = 'flex';
      }
    }

    // Google SSO handler
    document.getElementById('google-sso-btn')?.addEventListener('click', () => {
      const btn = document.getElementById('google-sso-btn');
      showLoading(btn, 'Connecting to Google...');

      setTimeout(() => {
        setSession('userEmail', email);
        setSession('isAuthenticated', true);
        setSession('authMethod', 'google');
        setSession('isNewUser', true);
        window.location.href = '../3-plan-selection.html';
      }, 1000);
    });

    // Microsoft SSO handler (simulated)
    document.getElementById('microsoft-sso-btn')?.addEventListener('click', () => {
      const btn = document.getElementById('microsoft-sso-btn');
      showLoading(btn, 'Connecting to Microsoft...');

      setTimeout(() => {
        setSession('userEmail', email);
        setSession('isAuthenticated', true);
        setSession('authMethod', 'microsoft');
        setSession('isNewUser', true);
        window.location.href = '../3-plan-selection.html';
      }, 1000);
    });

    // Magic Link handler
    document.getElementById('magic-link-btn').addEventListener('click', async () => {
      const btn = document.getElementById('magic-link-btn');
      showLoading(btn, 'Sending link...');

      // Create magic link token
      const result = createMagicLinkToken(email);

      if (result.error) {
        hideLoading(btn);
        showError(result.error);
        return;
      }

      // Simulate sending email
      await sendMagicLinkEmail(email, result.magicLink);

      // Store token data
      setSession('pendingMagicLink', result);

      // Redirect to confirmation screen
      window.location.href = 'magic-link-sent.html';
    });
  </script>
</body>
</html>
