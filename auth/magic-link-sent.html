<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Your Email - JADE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/jade.css">
  <style>
    .demo-logo {
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    .demo-logo:hover {
      transform: scale(1.05);
      opacity: 0.8;
    }
    .instruction-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .instruction-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      color: var(--primary);
    }
  </style>
</head>
<body class="jade-theme">
  <main id="main-content" class="flex-1 flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
    <div class="max-w-md w-full fade-in text-center">
      <!-- Logo - Click to continue (Demo) -->
      <img src="../jade_logo.svg" alt="JADE Legal Research" class="h-10 mx-auto mb-8 demo-logo" id="demo-logo" title="Click to simulate magic link (Demo)" />

      <h1 class="text-3xl sm:text-4xl font-bold mb-3" style="font-family: var(--font-serif); line-height: 1.2;">
        Check your email
      </h1>

      <p class="text-lg text-foreground mb-2">
        We sent a sign-in link to
      </p>
      <p class="text-lg font-semibold text-primary mb-6" id="sent-email"></p>

      <div class="card p-6 mb-6 text-left">
        <div class="instruction-item mb-4">
          <svg class="instruction-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 8L10.89 13.26C11.23 13.47 11.61 13.59 12 13.59C12.39 13.59 12.77 13.47 13.11 13.26L21 8M5 19H19C19.5304 19 20.0391 18.7893 20.4142 18.4142C20.7893 18.0391 21 17.5304 21 17V7C21 6.46957 20.7893 5.96086 20.4142 5.58579C20.0391 5.21071 19.5304 5 19 5H5C4.46957 5 3.96086 5.21071 3.58579 5.58579C3.21071 5.96086 3 6.46957 3 7V17C3 17.5304 3.21071 18.0391 3.58579 18.4142C3.96086 18.7893 4.46957 19 5 19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="text-sm jade-text-muted">
            Click the link in the email to sign in to JADE
          </p>
        </div>
        <div class="instruction-item mb-4">
          <svg class="instruction-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="text-sm jade-text-muted">
            The link will expire in <strong>15 minutes</strong>
          </p>
        </div>
        <div class="instruction-item">
          <svg class="instruction-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="text-sm jade-text-muted">
            Can't find the email? Check your spam folder
          </p>
        </div>
      </div>

      <div class="space-y-3">
        <button type="button" class="btn-secondary" id="resend-btn">
          Resend sign-in link
        </button>
        <div>
          <a href="../1-gated-landing.html" class="link-primary text-sm">
            Back to change email
          </a>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/magic-link.js"></script>
  
  <script>
    'use strict';

    const pendingLink = getSession('pendingMagicLink');
    const email = getSession('authEmail');

    if (!pendingLink || !email) {
      window.location.href = '../1-gated-landing.html';
    }

    document.getElementById('sent-email').textContent = email;

    // Demo: Click logo to simulate magic link
    document.getElementById('demo-logo').addEventListener('click', () => {
      // Extract query params from magic link and navigate to verify page
      const url = new URL(pendingLink.magicLink, window.location.href);
      window.location.href = 'verify.html' + url.search;
    });

    // Resend logic with cooldown
    let canResend = false;
    let cooldownSeconds = 60;

    function updateResendButton() {
      const btn = document.getElementById('resend-btn');

      if (canResend) {
        btn.disabled = false;
        btn.textContent = 'Resend sign-in link';
      } else {
        btn.disabled = true;
        btn.textContent = `Resend in ${cooldownSeconds}s`;
      }
    }

    // Start cooldown
    const cooldownInterval = setInterval(() => {
      cooldownSeconds--;
      updateResendButton();

      if (cooldownSeconds <= 0) {
        canResend = true;
        updateResendButton();
        clearInterval(cooldownInterval);
      }
    }, 1000);

    updateResendButton();

    // Resend handler
    document.getElementById('resend-btn').addEventListener('click', async () => {
      if (!canResend) return;

      const btn = document.getElementById('resend-btn');
      showLoading(btn, 'Sending...');

      const result = createMagicLinkToken(email);

      if (result.error) {
        hideLoading(btn);
        alert(result.error);
        return;
      }

      await sendMagicLinkEmail(email, result.magicLink);
      setSession('pendingMagicLink', result);

      hideLoading(btn);

      // Restart cooldown
      canResend = false;
      cooldownSeconds = 60;
      updateResendButton();
    });
  </script>
</body>
</html>
