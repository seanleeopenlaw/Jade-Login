<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Your Email - JADE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/jade.css">
  <link rel="stylesheet" href="../css/components/verification-code.css">
  <style>
    .demo-logo {
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    .demo-logo:hover {
      transform: scale(1.05);
      opacity: 0.8;
    }
    .instruction-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .instruction-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      color: var(--primary);
    }
  </style>
</head>
<body class="jade-theme">
  <main id="main-content" class="flex-1 flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
    <div class="max-w-md w-full fade-in text-center">
      <!-- Logo - Click to continue (Demo) -->
      <img src="../jade_logo.svg" alt="JADE Legal Research" class="h-10 mx-auto mb-8 demo-logo" id="demo-logo" title="Click to simulate magic link (Demo)" />

      <h1 class="text-3xl sm:text-4xl font-bold mb-3" style="font-family: var(--font-serif); line-height: 1.2;" id="page-title">
        Check your email
      </h1>

      <!-- Description (changes based on view) -->
      <div id="description-container">
        <p class="text-lg text-foreground mb-2" id="main-description">
          We sent a sign-in link to
        </p>
        <p class="text-lg font-semibold text-primary mb-6" id="sent-email"></p>
      </div>

      <!-- Instructions Card (Magic Link only) -->
      <div id="instructions-card" class="card p-6 mb-6 text-left">
        <div class="instruction-item mb-4">
          <svg class="instruction-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 8L10.89 13.26C11.23 13.47 11.61 13.59 12 13.59C12.39 13.59 12.77 13.47 13.11 13.26L21 8M5 19H19C19.5304 19 20.0391 18.7893 20.4142 18.4142C20.7893 18.0391 21 17.5304 21 17V7C21 6.46957 20.7893 5.96086 20.4142 5.58579C20.0391 5.21071 19.5304 5 19 5H5C4.46957 5 3.96086 5.21071 3.58579 5.58579C3.21071 5.96086 3 6.46957 3 7V17C3 17.5304 3.21071 18.0391 3.58579 18.4142C3.96086 18.7893 4.46957 19 5 19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="text-sm jade-text-muted">
            Click the link in the email to sign in to JADE
          </p>
        </div>
        <div class="instruction-item mb-4">
          <svg class="instruction-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="text-sm jade-text-muted">
            The link will expire in <strong>15 minutes</strong>
          </p>
        </div>
        <div class="instruction-item mb-4">
          <svg class="instruction-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="text-sm jade-text-muted">
            Can't find the email? Check your spam folder
          </p>
        </div>
        <div class="instruction-item">
          <svg class="instruction-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9.09 9C9.3251 8.33167 9.78915 7.76811 10.4 7.40913C11.0108 7.05016 11.7289 6.91894 12.4272 7.03871C13.1255 7.15849 13.7588 7.52152 14.2151 8.06353C14.6713 8.60553 14.9211 9.29152 14.92 10C14.92 12 11.92 13 11.92 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 17H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="text-sm jade-text-muted">
            Need help? <a href="mailto:help@jade.io" class="link-primary font-semibold hover:underline">Contact Support Team</a>
          </p>
        </div>
      </div>

      <!-- Magic Link View -->
      <div id="magic-link-view" class="space-y-4">
        <!-- Two buttons side by side -->
        <div class="grid grid-cols-2 gap-3">
          <button type="button" class="btn-secondary" id="resend-btn">
            Resend sign-in link
          </button>
          <button type="button" class="btn-secondary" id="use-code-btn">
            Use Verification Code
          </button>
        </div>

        <!-- Use Different Email link below -->
        <div class="text-center">
          <a href="../1-gated-landing.html" class="link-primary text-sm">
            Use Different Email
          </a>
        </div>
      </div>

      <!-- Verification Code View (hidden by default) -->
      <div id="code-view" class="space-y-6" style="display: none;">
        <!-- 6-Digit Code Input Boxes -->
        <div class="verification-code-container" id="verification-code-container">
          <input type="text" class="verification-code-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" data-index="0" autocomplete="off" />
          <input type="text" class="verification-code-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" data-index="1" autocomplete="off" />
          <input type="text" class="verification-code-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" data-index="2" autocomplete="off" />
          <input type="text" class="verification-code-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" data-index="3" autocomplete="off" />
          <input type="text" class="verification-code-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" data-index="4" autocomplete="off" />
          <input type="text" class="verification-code-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" data-index="5" autocomplete="off" />
        </div>

        <div class="verification-button-wrapper">
          <button type="button" class="btn-primary" id="verify-code-btn">
            Verify
          </button>
        </div>

        <div class="text-center">
          <button type="button" class="link-primary text-sm" id="back-to-link-btn" style="background: none; border: none; cursor: pointer;">
            Back to Sign-in Link
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/magic-link.js"></script>
  <script src="../js/verification-code.js"></script>

  <script>
    'use strict';

    const pendingLink = getSession('pendingMagicLink');
    const email = getSession('authEmail');

    if (!pendingLink || !email) {
      window.location.href = '../1-gated-landing.html';
    }

    document.getElementById('sent-email').textContent = email;

    // Demo: Click logo to simulate magic link
    document.getElementById('demo-logo').addEventListener('click', () => {
      // Extract query params from magic link and navigate to verify page
      const url = new URL(pendingLink.magicLink, window.location.href);
      window.location.href = 'verify.html' + url.search;
    });

    // Resend logic with cooldown
    let canResend = false;
    let cooldownSeconds = 60;

    function updateResendButton() {
      const btn = document.getElementById('resend-btn');

      if (canResend) {
        btn.disabled = false;
        btn.textContent = 'Resend sign-in link';
      } else {
        btn.disabled = true;
        btn.textContent = `Resend in ${cooldownSeconds}s`;
      }
    }

    // Start cooldown
    const cooldownInterval = setInterval(() => {
      cooldownSeconds--;
      updateResendButton();

      if (cooldownSeconds <= 0) {
        canResend = true;
        updateResendButton();
        clearInterval(cooldownInterval);
      }
    }, 1000);

    updateResendButton();

    // Resend handler
    document.getElementById('resend-btn').addEventListener('click', async () => {
      if (!canResend) return;

      const btn = document.getElementById('resend-btn');
      showLoading(btn, 'Sending...');

      const result = createMagicLinkToken(email);

      if (result.error) {
        hideLoading(btn);
        alert(result.error);
        return;
      }

      await sendMagicLinkEmail(email, result.magicLink);
      setSession('pendingMagicLink', result);

      hideLoading(btn);

      // Restart cooldown
      canResend = false;
      cooldownSeconds = 60;
      updateResendButton();
    });

    // View toggle functionality
    const magicLinkView = document.getElementById('magic-link-view');
    const codeView = document.getElementById('code-view');
    const instructionsCard = document.getElementById('instructions-card');
    const pageTitle = document.getElementById('page-title');
    const mainDescription = document.getElementById('main-description');
    const sentEmailElement = document.getElementById('sent-email');
    const useCodeBtn = document.getElementById('use-code-btn');
    const backToLinkBtn = document.getElementById('back-to-link-btn');
    const verifyCodeBtn = document.getElementById('verify-code-btn');

    // Initialize verification code input handler
    let verificationCodeInput = null;

    // Switch to verification code view
    useCodeBtn.addEventListener('click', () => {
      // Hide magic link elements
      magicLinkView.style.display = 'none';
      instructionsCard.style.display = 'none';

      // Update title and description
      pageTitle.textContent = 'Enter verification code';
      mainDescription.textContent = 'We sent a 6-digit code to';

      // Show code view
      codeView.style.display = 'block';

      // Initialize verification code handler if not already initialized
      if (!verificationCodeInput) {
        verificationCodeInput = new VerificationCodeInput({
          containerSelector: '#verification-code-container',
          buttonSelector: '#verify-code-btn',
          onVerify: handleVerifyCode
        });
      }

      // Focus first input
      verificationCodeInput.focus();

      // Store that user is using code verification
      setSession('usingCodeVerification', true);
    });

    // Switch back to magic link view
    backToLinkBtn.addEventListener('click', () => {
      // Show magic link elements
      codeView.style.display = 'none';
      magicLinkView.style.display = 'block';
      instructionsCard.style.display = 'block';

      // Restore original title and description
      pageTitle.textContent = 'Check your email';
      mainDescription.textContent = 'We sent a sign-in link to';

      // Clear all code inputs
      if (verificationCodeInput) {
        verificationCodeInput.clear();
      }

      // Clear code verification flag
      setSession('usingCodeVerification', false);
    });

    // Verify code handler function
    function handleVerifyCode(code) {
      if (code.length !== 6 || !/^\d{6}$/.test(code)) {
        alert('Please enter a valid 6-digit code');
        verificationCodeInput.focus();
        return;
      }

      showLoading(verifyCodeBtn, 'Verifying...');

      // Simulate verification (in production, verify against backend)
      setTimeout(() => {
        // For demo: accept any 6-digit code
        // In production: verify code against backend

        // Store verification method
        setSession('verificationMethod', 'code');
        setSession('verifiedCode', code);

        hideLoading(verifyCodeBtn);

        // Navigate to verify page with code verification flag
        window.location.href = 'verify.html?method=code';
      }, 800);
    }
  </script>
</body>
</html>
