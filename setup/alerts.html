<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Alert Preferences - JADE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/jade.css">

  <style>
    /* Stepper Styles */
    .stepper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2rem 0;
    }

    .stepper-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      flex: 1;
      max-width: 200px;
    }

    .stepper-item:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 20px;
      left: calc(50% + 20px);
      width: calc(100% - 40px);
      height: 3px;
      background-color: var(--border);
      z-index: -1;
    }

    .stepper-item.completed:not(:last-child)::after {
      background-color: var(--primary);
    }

    .stepper-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--background);
      border: 2px solid var(--border);
      color: var(--muted-foreground);
      font-weight: var(--font-semibold);
      transition: all var(--transition-base);
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }

    .stepper-item.completed .stepper-circle {
      background-color: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .stepper-item.active .stepper-circle {
      border-color: var(--primary);
      border-width: 3px;
      color: var(--primary);
    }

    .stepper-label {
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted-foreground);
      font-weight: var(--font-medium);
    }

    .stepper-item.completed .stepper-label,
    .stepper-item.active .stepper-label {
      color: var(--foreground);
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    @media (min-width: 640px) {
      .checkbox-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .checkbox-item {
      position: relative;
    }

    .checkbox-item input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .checkbox-item label {
      display: flex;
      align-items: center;
      padding: 0.625rem 0.75rem;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--transition-base);
      background-color: var(--background);
    }

    .checkbox-item input[type="checkbox"]:checked + label {
      border-color: var(--primary);
      background-color: var(--accent);
    }

    .checkbox-item label:hover {
      border-color: var(--primary);
    }

    .checkbox-item label::before {
      content: '';
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-radius: 4px;
      margin-right: 0.625rem;
      flex-shrink: 0;
      transition: all var(--transition-base);
    }

    .checkbox-item input[type="checkbox"]:checked + label::before {
      background-color: var(--primary);
      border-color: var(--primary);
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='10' viewBox='0 0 12 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 3L4.5 8.5L2 6' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: center;
    }

    .court-name {
      font-weight: var(--font-medium);
      font-size: 0.875rem;
      line-height: 1.3;
    }

    .court-abbr {
      font-size: 0.75rem;
      color: var(--muted-foreground);
      margin-left: 0.25rem;
      font-weight: var(--font-normal);
    }

    .quick-actions {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .quick-action-btn {
      padding: 0.5rem 1rem;
      background-color: var(--accent);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: var(--font-medium);
      transition: all var(--transition-base);
      color: var(--foreground);
    }

    .quick-action-btn:hover {
      background-color: var(--muted);
    }
  </style>
</head>
<body class="jade-theme">
  <main id="main-content" class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="max-w-3xl w-full fade-in">
      <!-- Logo -->
      <div class="text-center mb-8">
        <img src="../jade_logo.svg" alt="JADE Legal Research" class="h-10 mx-auto mb-6" />
        <h1 class="text-3xl sm:text-4xl font-bold mb-3" style="font-family: var(--font-serif); line-height: 1.2;">
          Choose Courts to Follow
        </h1>
        <p class="text-base jade-text-muted">
          Select the courts you'd like to receive alerts for
        </p>
      </div>

      <!-- Stepper -->
      <div class="stepper">
        <div class="stepper-item completed">
          <div class="stepper-circle">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M16 6L8 14L4 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="stepper-label">Personal Details</span>
        </div>
        <div class="stepper-item active">
          <div class="stepper-circle">
            2
          </div>
          <span class="stepper-label">Alert Preferences</span>
        </div>
      </div>

      <!-- Form Card -->
      <div class="card p-6 sm:p-8">
        <div id="error-message" class="error-message" role="alert" aria-live="assertive">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M12 8v4m0 4h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="error-text"></span>
        </div>

        <form id="alerts-form">
          <!-- Quick Actions -->
          <div class="quick-actions">
            <button type="button" id="select-all-btn" class="quick-action-btn">Select All</button>
            <button type="button" id="clear-all-btn" class="quick-action-btn">Clear All</button>
          </div>

          <!-- Court Selection -->
          <div class="checkbox-grid mb-6">
            <div class="checkbox-item">
              <input type="checkbox" id="court-hca" name="courts" value="HCA">
              <label for="court-hca">
                <span class="court-name">High Court of Australia <span class="court-abbr">(HCA)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-hcasj" name="courts" value="HCASJ">
              <label for="court-hcasj">
                <span class="court-name">High Court of Australia Single Justice Judgments <span class="court-abbr">(HCASJ)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-nzsc" name="courts" value="NZSC">
              <label for="court-nzsc">
                <span class="court-name">Supreme Court of New Zealand <span class="court-abbr">(NZSC)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-fcafc" name="courts" value="FCAFC">
              <label for="court-fcafc">
                <span class="court-name">Federal Court of Australia - Full Court <span class="court-abbr">(FCAFC)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-famcafc" name="courts" value="FamCAFC">
              <label for="court-famcafc">
                <span class="court-name">Family Court of Australia - Full Court <span class="court-abbr">(FamCAFC)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-fedcfamc1a" name="courts" value="FedCFamC1A">
              <label for="court-fedcfamc1a">
                <span class="court-name">Federal Circuit and Family Court - Division 1 Appellate Jurisdiction <span class="court-abbr">(FedCFamC1A)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-actca" name="courts" value="ACTCA">
              <label for="court-actca">
                <span class="court-name">Supreme Court of the Australian Capital Territory - Court of Appeal <span class="court-abbr">(ACTCA)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-nswca" name="courts" value="NSWCA">
              <label for="court-nswca">
                <span class="court-name">Supreme Court of New South Wales - Court of Appeal <span class="court-abbr">(NSWCA)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-nswcca" name="courts" value="NSWCCA">
              <label for="court-nswcca">
                <span class="court-name">Supreme Court of New South Wales - Court of Criminal Appeal <span class="court-abbr">(NSWCCA)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-ntca" name="courts" value="NTCA">
              <label for="court-ntca">
                <span class="court-name">Supreme Court of the Northern Territory - Court of Appeal <span class="court-abbr">(NTCA)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-ntcca" name="courts" value="NTCCA">
              <label for="court-ntcca">
                <span class="court-name">Supreme Court of the Northern Territory - Court of Criminal Appeal <span class="court-abbr">(NTCCA)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-ntscfc" name="courts" value="NTSCFC">
              <label for="court-ntscfc">
                <span class="court-name">Supreme Court of the Northern Territory - Full Court <span class="court-abbr">(NTSCFC)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-nzca" name="courts" value="NZCA">
              <label for="court-nzca">
                <span class="court-name">Court of Appeal of New Zealand <span class="court-abbr">(NZCA)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-qca" name="courts" value="QCA">
              <label for="court-qca">
                <span class="court-name">Supreme Court of Queensland - Court of Appeal <span class="court-abbr">(QCA)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-sasca" name="courts" value="SASCA">
              <label for="court-sasca">
                <span class="court-name">Supreme Court of South Australia - Court of Appeal <span class="court-abbr">(SASCA)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-sascfc" name="courts" value="SASCFC">
              <label for="court-sascfc">
                <span class="court-name">Supreme Court of South Australia - Full Court <span class="court-abbr">(SASCFC)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-tascca" name="courts" value="TASCCA">
              <label for="court-tascca">
                <span class="court-name">Supreme Court of Tasmania - Court of Criminal Appeal <span class="court-abbr">(TASCCA)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-tasfc" name="courts" value="TASFC">
              <label for="court-tasfc">
                <span class="court-name">Supreme Court of Tasmania - Full Court <span class="court-abbr">(TASFC)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-vsca" name="courts" value="VSCA">
              <label for="court-vsca">
                <span class="court-name">Supreme Court of Victoria - Court of Appeal <span class="court-abbr">(VSCA)</span></span>
              </label>
            </div>

            <div class="checkbox-item">
              <input type="checkbox" id="court-wasca" name="courts" value="WASCA">
              <label for="court-wasca">
                <span class="court-name">Supreme Court of Western Australia - Court of Appeal <span class="court-abbr">(WASCA)</span></span>
              </label>
            </div>
          </div>

          <!-- Selected Count -->
          <p class="text-sm jade-text-muted mb-6">
            <span id="selected-count">0</span> court(s) selected
          </p>

          <!-- Navigation Buttons -->
          <div class="flex flex-col sm:flex-row gap-3">
            <button type="button" id="back-btn" class="btn-secondary">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Back
            </button>
            <button type="submit" id="continue-btn" class="btn-primary">
              Continue
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </form>
      </div>

      <!-- Helper Text -->
      <p class="text-xs jade-text-muted text-center mt-4">
        You can modify your alert preferences anytime in your account settings
      </p>
    </div>
  </main>

  <script src="../js/utils.js"></script>

  <script>
    'use strict';

    // Check authentication and previous step
    const isAuthenticated = getSession('isAuthenticated');
    const onboardingData = getOnboardingData();

    if (!isAuthenticated || !onboardingData || !onboardingData.firstName) {
      window.location.href = 'index.html';
    }

    // Load existing court selections if any
    if (onboardingData.courts && Array.isArray(onboardingData.courts)) {
      onboardingData.courts.forEach(courtValue => {
        const checkbox = document.querySelector(`input[value="${courtValue}"]`);
        if (checkbox) checkbox.checked = true;
      });
    }

    // Update selected count
    function updateSelectedCount() {
      const selected = document.querySelectorAll('input[name="courts"]:checked').length;
      document.getElementById('selected-count').textContent = selected;
    }

    // Initial count update
    updateSelectedCount();

    // Listen to checkbox changes
    document.querySelectorAll('input[name="courts"]').forEach(checkbox => {
      checkbox.addEventListener('change', updateSelectedCount);
    });

    // Select All button
    document.getElementById('select-all-btn').addEventListener('click', () => {
      document.querySelectorAll('input[name="courts"]').forEach(checkbox => {
        checkbox.checked = true;
      });
      updateSelectedCount();
    });

    // Clear All button
    document.getElementById('clear-all-btn').addEventListener('click', () => {
      document.querySelectorAll('input[name="courts"]').forEach(checkbox => {
        checkbox.checked = false;
      });
      updateSelectedCount();
    });

    // Back button
    document.getElementById('back-btn').addEventListener('click', () => {
      // Save current selections before going back
      const selectedCourts = Array.from(document.querySelectorAll('input[name="courts"]:checked'))
        .map(cb => cb.value);

      saveOnboardingData({ courts: selectedCourts });
      window.location.href = 'index.html';
    });

    // Form submission
    document.getElementById('alerts-form').addEventListener('submit', (e) => {
      e.preventDefault();

      const selectedCourts = Array.from(document.querySelectorAll('input[name="courts"]:checked'))
        .map(cb => cb.value);

      // Validation: At least 1 court must be selected
      if (selectedCourts.length === 0) {
        showError('Please select at least one court to continue');
        return;
      }

      // Save court preferences
      saveOnboardingData({ courts: selectedCourts });

      // Navigate to welcome page
      window.location.href = '../welcome.html';
    });
  </script>
</body>
</html>
