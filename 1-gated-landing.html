<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - JADE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/jade.css">
</head>
<body class="jade-theme">
  <!-- Main Content -->
  <main id="main-content" class="flex-1 flex items-center justify-center px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
    <div class="max-w-md w-full fade-in">
      <!-- Headline -->
      <div class="text-center mb-8">
        <img src="jade_logo.svg" alt="JADE Legal Research" class="h-10 mx-auto mb-8" />
        <h1 class="text-3xl sm:text-4xl font-bold mb-3" style="font-family: var(--font-serif); line-height: 1.2;">
          Sign in to JADE
        </h1>
        <p class="text-base jade-text-muted">
          Enter your email to get started.<br>
          We'll check if your organization uses single sign-on.
        </p>
      </div>

      <!-- Sign In Card -->
      <div class="card p-6 sm:p-8">
        <!-- Error Message -->
        <div id="error-message" class="error-message" role="alert" aria-live="assertive">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M12 8v4m0 4h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="error-text"></span>
        </div>

        <!-- Status announcer for screen readers -->
        <div aria-live="polite" aria-atomic="true" class="sr-only" id="status-message"></div>

        <form id="email-form" class="space-y-5" novalidate>
          <!-- Email Input -->
          <div>
            <label for="email" class="block text-sm font-medium mb-2">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              class="input-field"
              placeholder="your@email.com"
              required
              autofocus
              autocomplete="email"
              aria-required="true"
              aria-describedby="email-error email-hint"
            />
            <p id="email-hint" class="text-xs jade-text-muted mt-1">
              We'll check if your organization uses single sign-on
            </p>
            <span id="email-error" class="error-text" style="display: none; color: var(--error); font-size: 0.875rem; margin-top: 0.25rem;"></span>
          </div>

          <!-- Continue Button -->
          <button type="submit" class="btn-primary" id="continue-btn">
            Continue
          </button>
        </form>

        <!-- Info Text -->
        <p class="text-xs text-center jade-text-muted mt-6">
          Don't have an account? No worries — we'll create one for you automatically.
        </p>
      </div>
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/sso-config.js"></script>
  <script src="js/magic-link.js"></script>
  <script>
    'use strict';

    const emailInput = document.getElementById('email');
    const emailForm = document.getElementById('email-form');
    const continueBtn = document.getElementById('continue-btn');

    // Input validation
    function validateEmail() {
      const email = emailInput.value.trim();
      const errorEl = document.getElementById('email-error');

      if (!email) {
        emailInput.classList.add('error');
        errorEl.textContent = 'Please enter your email address';
        errorEl.style.display = 'block';
        return false;
      }

      if (!isValidEmail(email)) {
        emailInput.classList.add('error');
        errorEl.textContent = 'Please enter a valid email address';
        errorEl.style.display = 'block';
        return false;
      }

      emailInput.classList.remove('error');
      errorEl.style.display = 'none';
      return true;
    }

    // Real-time validation
    emailInput.addEventListener('blur', validateEmail);

    // Clear error on input
    emailInput.addEventListener('input', () => {
      if (emailInput.classList.contains('error')) {
        emailInput.classList.remove('error');
        document.getElementById('email-error').style.display = 'none';
      }
      hideError();
    });

    // Form submission - check for SSO or send magic link
    emailForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      if (!validateEmail()) {
        showError('Please enter a valid email address');
        return;
      }

      const email = emailInput.value.trim();

      // Show loading state
      showLoading(continueBtn, 'Checking...');
      document.getElementById('status-message').textContent = 'Checking authentication methods';

      // Simulate checking for SSO (in real app, this would be API call)
      await new Promise(resolve => setTimeout(resolve, 800));

      // Store email in session
      setSession('authEmail', email);

      // Detect SSO availability
      const authMethods = getAuthMethods(email);
      setSession('authMethods', authMethods);

      // If SSO is available, go to method selection
      if (authMethods.hasSSO) {
        window.location.href = 'auth/step2-method.html';
      } else {
        // No SSO, send magic link directly
        showLoading(continueBtn, 'Sending sign-in link...');

        const result = createMagicLinkToken(email);

        if (result.error) {
          hideLoading(continueBtn);
          showError(result.error);
          return;
        }

        // Simulate sending email
        await sendMagicLinkEmail(email, result.magicLink);

        // Store token data
        setSession('pendingMagicLink', result);

        // Redirect to confirmation screen
        window.location.href = 'auth/magic-link-sent.html';
      }
    });
  </script>
</body>
</html>
